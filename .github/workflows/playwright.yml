name: Playwright Tests & Allure Report

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Parabank/package-lock.json

      - name: Install Dependencies
        working-directory: ./Parabank
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./Parabank
        run: npx playwright install --with-deps

      - name: Wait before running tests
        run: sleep 30

      - name: Run Playwright Tests
        working-directory: ./Parabank
        run: npm run test:ci

        continue-on-error: true

      - name: Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-1
          path: Parabank/allure-results
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]

    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Parabank/package-lock.json

      - name: Install Dependencies
        working-directory: ./Parabank
        run: npm ci

      - name: Download Allure Raw Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: Parabank/allure-results

      - name: Ensure Allure Results Directory
        run: mkdir -p Parabank/allure-results

      - name: Generate Allure Report
        working-directory: ./Parabank
        run: npm run allure:generate

      - name: Check Allure Report Files
        run: ls -la Parabank/allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: Parabank/allure-report
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: always() && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Parabank/allure-report